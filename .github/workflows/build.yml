name: Build PowerToys

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build x64 Release
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    env:
      NUGET_RESTORE_MSBUILD_ARGS: /p:Platform=x64
      NODE_OPTIONS: --max_old_space_size=16384

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
        with:
          nuget-version: '6.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages (packages.config)
        run: |
          nuget restore packages.config -PackagesDirectory packages

      - name: Build PowerToys
        run: |
          msbuild PowerToys.slnx `
            -restore -graph `
            /p:RestorePackagesConfig=true `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:CIBuild=true `
            /p:BuildTests=false `
            /t:Build `
            /m
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PowerToys-x64-Release
          path: |
            x64/Release/
            !x64/Release/**/*.pdb
            !x64/Release/**/*.ipdb
            !x64/Release/**/*.iobj
            !x64/Release/**/*.lib
            !x64/Release/**/*.exp
          retention-days: 14
